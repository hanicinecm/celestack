[project]
name = "celestack"
version = "0.1.0"
description = "Starscape photography track & stack software"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=7.2.0",
    "exifread>=3.5.1",
    "numpy>=2.4.4",
    "pillow>=12.1.1",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "tifffile>=2026.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
