[project]
name = "celestack"
version = "0.1.0"
description = "Starscape photography track & stack software"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "exifread>=3.5.1",
    "numpy>=2.4.4",
    "pillow>=12.1.1",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "tifffile>=2026.3.3",
    "rich>=14.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.0",
    "photutils>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:Number of distinct clusters .* found smaller than n_clusters:sklearn.exceptions.ConvergenceWarning",
]

[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "piexif>=1.1.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
