[project]
name = "celestack"
version = "0.1.0"
description = "Nightscape photography track & stack software"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "exifread>=3.0.0",
    "numpy>=2.2.4",
    "pillow>=11.1.0",
    "pyyaml>=6.0.2",
    "tifffile>=2025.3.30",
]

[project.scripts]
celestack = "celestack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.0.2",
]
