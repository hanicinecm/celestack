[project]
name = "celestack"
version = "0.1.0"
description = "Nightscape photography track & stack software"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.0.1",
    "exifread>=3.0.0",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "photutils>=2.2.0",
    "pillow>=11.1.0",
    "plotly>=6.0.1",
    "pyyaml>=6.0.2",
    "tifffile>=2025.3.30",
    "tqdm>=4.67.1",
]

[project.scripts]
celestack = "celestack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "icecream>=2.1.4",
    "jupyter>=1.1.1",
    "scikit-learn>=1.6.1",
]
